<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Strata — satellite lifecycle cards for closed mine waste sites (demo)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Strata gives each closed mine waste site a satellite lifecycle card: what it looks like now, how it has changed over ten years, how big the heap is, who lives nearby, and what the three pathways (leave and monitor, rehabilitate, reprocess) would involve.">
  <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/logos/strata-mark-black.svg">
  <link rel="apple-touch-icon" href="/assets/logos/strata-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <script>
    (function(){
      try {
        var saved = localStorage.getItem('strata-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch(_) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets/strata/styles.css?v=c05e29b2">
  <!-- Leaflet: real raster-tile map behind the pins. ESRI World
       Imagery + OSM labels are added in app.js. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" defer></script>
  <!-- Import map so the bare 'geotiff' specifier in strata/core.js
       resolves to a browser-ready ES build on jsdelivr. Must come
       before any <script type="module">. -->
  <script type="importmap">
  {
    "imports": {
      "geotiff": "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm"
    }
  }
  </script>
</head>
<body class="strata-standalone">
  <div id="strata-root"></div>
  <script type="module" src="/assets/strata/app.js?v=81334a8a"></script>
</body>
</html>
