<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Hanken Grotesk',system-ui,sans-serif">
  <defs>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
      .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;fill:#6B6457;}
    </style>
    <pattern id="hatch2" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#DAD4C3"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#C8C0AB" stroke-width="3"/>
    </pattern>
  </defs>
  <!-- Nav -->
  <rect x="0" y="0" width="1600" height="66" fill="#FFFFFF"/>
  <g transform="translate(28,22)">
    <rect x="0" y="4" width="18" height="18" fill="#2E7A3C"/>
    <text x="28" y="20" font-size="18" font-weight="800" fill="#121212">Strata</text>
    <text x="110" y="20" class="mono" style="font-size:10.5px;letter-spacing:.14em;" fill="#6B6457">TRANSITIONS LAB</text>
  </g>
  <g transform="translate(380,24)" font-size="13.5">
    <text x="0" y="18" fill="#121212" font-weight="700">Map</text>
    <line x1="-6" y1="36" x2="36" y2="36" stroke="#121212" stroke-width="2"/>
    <text x="80" y="18" fill="#6B6457">Functions</text>
    <text x="200" y="18" fill="#6B6457">Sign in</text>
  </g>
  <!-- Demo strip -->
  <rect x="0" y="66" width="1600" height="34" fill="#F0E6CF"/>
  <text x="28" y="88" class="mono" fill="#6B6457" style="font-size:10.5px;letter-spacing:.14em;">DEMO VERSION  ·  SITE CODES AND INDICATOR VALUES ARE ILLUSTRATIVE AND DO NOT DESCRIBE REAL PROJECTS</text>

  <!-- Left column (narrower) -->
  <rect x="0" y="100" width="300" height="800" fill="#FFFFFF"/>
  <g transform="translate(24,126)">
    <text class="kick mono">SITES SHOWN</text><text x="140" y="0" class="kick mono">PRE-CONSTRUCTION</text>
    <text y="30" font-size="22" font-weight="800" fill="#121212">16</text><text x="30" y="30" fill="#6B6457" font-size="11">/ 16</text>
    <text x="140" y="30" font-size="22" font-weight="800" fill="#121212">6</text>
    <text y="60" class="kick mono">DISTURBED, 2026</text><text x="140" y="60" class="kick mono">OPEN ALERTS</text>
    <text y="88" font-size="20" font-weight="800" fill="#121212">2,464</text>
    <text x="140" y="88" font-size="20" font-weight="800" fill="#C64A2E">3</text>
  </g>
  <rect x="24" y="236" width="252" height="34" fill="#F3EDE1" stroke="#D9D1BE"/>
  <text x="34" y="258" fill="#8A8574" font-size="11.5">Search sites, materials, countries</text>

  <!-- Highlighted site in list -->
  <g transform="translate(24,330)">
    <rect width="252" height="68" fill="#F3EDE1" stroke="#D9D1BE"/>
    <rect y="12" width="4" height="44" fill="#C64A2E"/>
    <text x="14" y="22" font-size="12.5" font-weight="700">Nickel and cobalt mine,</text>
    <text x="14" y="38" font-size="12.5" font-weight="700">eastern Finland</text>
    <text x="14" y="56" class="mono" font-size="10" fill="#6B6457">FI-N1 · NICKEL · COBALT · OPERATING</text>
    <text x="240" y="22" font-size="12" text-anchor="end" font-weight="700">1,389 ha</text>
    <text x="240" y="38" font-size="10.5" text-anchor="end" fill="#C64A2E" font-weight="700">ALERT</text>
  </g>

  <!-- Map -->
  <rect x="300" y="100" width="900" height="800" fill="#EFE9D8"/>
  <path d="M 500 260 L 560 220 L 640 230 L 720 190 L 780 200 L 820 250 L 870 230 L 900 280 L 940 310 L 960 360 L 980 420 L 970 470 L 940 520 L 950 580 L 980 620 L 1020 680 L 1050 740 L 980 780 L 900 760 L 820 780 L 760 750 L 700 760 L 620 740 L 560 720 L 500 700 L 450 650 L 420 600 L 410 540 L 400 480 L 410 420 L 440 360 L 470 310 Z"
        fill="url(#hatch2)" opacity="0.9"/>
  <g stroke="#DCD4BE" stroke-width="1" fill="none">
    <line x1="400" y1="150" x2="400" y2="900"/><line x1="600" y1="150" x2="600" y2="900"/>
    <line x1="800" y1="150" x2="800" y2="900"/><line x1="1000" y1="150" x2="1000" y2="900"/>
    <line x1="340" y1="300" x2="1200" y2="300"/><line x1="340" y1="500" x2="1200" y2="500"/>
    <line x1="340" y1="700" x2="1200" y2="700"/>
  </g>

  <!-- Zoom + layers -->
  <g transform="translate(1140,160)" fill="#FFFFFF" stroke="#121212">
    <rect width="30" height="30"/><text x="15" y="22" text-anchor="middle" font-size="18" fill="#121212" stroke="none">+</text>
    <rect y="34" width="30" height="30"/><text x="15" y="56" text-anchor="middle" font-size="18" fill="#121212" stroke="none">−</text>
  </g>
  <g transform="translate(990,160)">
    <rect width="140" height="100" fill="#FFFFFF" stroke="#121212"/>
    <text x="12" y="18" class="kick mono">LAYERS</text>
    <rect x="12" y="30" width="12" height="12" fill="#2E7A3C"/><text x="32" y="40" font-size="11">Site codes</text>
    <rect x="12" y="50" width="12" height="12" fill="none" stroke="#121212"/><text x="32" y="60" font-size="11">EGMS coverage</text>
    <rect x="12" y="70" width="12" height="12" fill="none" stroke="#121212"/><text x="32" y="80" font-size="11">Natura 2000</text>
  </g>

  <!-- Highlighted FI-N1 with ring -->
  <circle cx="900" cy="300" r="20" fill="none" stroke="#121212" stroke-width="2"/>
  <circle cx="900" cy="300" r="12" fill="#C64A2E"/>
  <text x="920" y="304" font-size="10" class="mono" fill="#121212">FI-N1</text>

  <!-- Other sites (muted) -->
  <g font-size="10" class="mono" fill="#121212" opacity=".7">
    <circle cx="820" cy="300" r="5" fill="none" stroke="#121212" stroke-width="2"/><text x="832" y="304">SE-R1</text>
    <circle cx="860" cy="340" r="6" fill="#C64A2E"/><text x="874" y="344">SE-G1</text>
    <circle cx="700" cy="420" r="5" fill="none" stroke="#121212" stroke-width="2"/><text x="712" y="424">NO-R1</text>
    <circle cx="900" cy="440" r="6" fill="#2E7A3C"/><text x="914" y="444">EE-R1</text>
    <circle cx="870" cy="620" r="6" fill="#D7A54B"/><text x="884" y="624">DE-L1</text>
    <circle cx="860" cy="650" r="6" fill="#2E7A3C"/><text x="874" y="654">DE-B1</text>
    <circle cx="930" cy="650" r="12" fill="#C64A2E"/><text x="950" y="654">PL-C1</text>
    <circle cx="760" cy="620" r="6" fill="#2E7A3C"/><text x="774" y="624">BE-C1</text>
    <circle cx="760" cy="760" r="7" fill="#D7A54B"/><text x="774" y="764">FR-L1</text>
  </g>

  <!-- Right site panel: FI-N1 -->
  <rect x="1200" y="100" width="400" height="800" fill="#FFFFFF"/>
  <g transform="translate(1220,140)">
    <rect width="14" height="14" fill="#C64A2E"/>
    <text x="22" y="12" class="kick mono">FI-N1 · NICKEL · COBALT · INTEGRATED</text>
  </g>
  <text x="1220" y="200" font-size="20" font-weight="800" fill="#121212">Nickel and cobalt</text>
  <text x="1220" y="226" font-size="20" font-weight="800" fill="#121212">mine, eastern Finland</text>
  <g transform="translate(1220,246)">
    <rect width="90" height="24" fill="#2E7A3C"/><text x="45" y="17" fill="#F3EDE1" font-size="11" font-weight="800" text-anchor="middle">OPERATING</text>
    <rect x="98" width="60" height="24" fill="#C64A2E"/><text x="128" y="17" fill="#F3EDE1" font-size="11" font-weight="800" text-anchor="middle">ALERT</text>
  </g>
  <rect x="1220" y="282" width="360" height="46" fill="#F8E7E0" stroke="#C64A2E"/>
  <text x="1232" y="302" font-size="11.5" fill="#8E2A14">Ground motion above 8 mm/yr at tailings dam. Flagged for</text>
  <text x="1232" y="318" font-size="11.5" fill="#8E2A14">review, not a finding of non-compliance.</text>

  <g transform="translate(1220,350)" fill="#121212">
    <text class="kick mono">BASELINE YEAR</text><text x="190" class="kick mono">FOOTPRINT 2026</text>
    <text y="26" font-size="22" font-weight="800">2019</text>
    <text x="190" y="26" font-size="22" font-weight="800">1,389 <tspan font-size="12" fill="#6B6457">ha</tspan></text>
    <line x1="0" y1="46" x2="360" y2="46" stroke="#D9D1BE"/>
    <text y="68" class="kick mono">SINCE BASELINE</text><text x="190" y="68" class="kick mono">WORKS STARTED</text>
    <text y="94" font-size="20" font-weight="800" fill="#C64A2E">+179 <tspan font-size="12" fill="#6B6457">ha  · +15%</tspan></text>
    <text x="190" y="94" font-size="22" font-weight="800">2008</text>
  </g>

  <!-- Flat high chart -->
  <g transform="translate(1220,480)">
    <text class="kick mono">DISTURBED FOOTPRINT, HECTARES</text>
    <rect y="16" width="360" height="130" fill="#F8E7E0" opacity=".55"/>
    <line x1="0" y1="146" x2="360" y2="146" stroke="#121212"/>
    <polyline points="0,30 60,28 120,26 180,24 240,22 300,20 360,16" fill="none" stroke="#C64A2E" stroke-width="2.5"/>
    <text y="20" font-size="10" class="mono" fill="#121212">1,597</text>
    <text y="78" font-size="10" class="mono" fill="#6B6457">799</text>
    <text y="142" font-size="10" class="mono" fill="#6B6457">0</text>
    <text x="340" y="160" font-size="10" fill="#6B6457">2026</text>
  </g>

  <!-- Footprint outline -->
  <g transform="translate(1220,660)">
    <text class="kick mono">FOOTPRINT OUTLINE</text>
    <rect y="16" width="360" height="150" fill="#F3EDE1" opacity=".3" stroke="#D9D1BE"/>
    <circle cx="180" cy="90" r="56" fill="none" stroke="#D9D1BE" stroke-dasharray="2 2"/>
    <path d="M 130 70 Q 220 50 240 100 Q 240 140 170 140 Q 110 130 130 70" fill="#C64A2E" opacity=".55"/>
    <path d="M 130 70 Q 220 50 240 100 Q 240 140 170 140 Q 110 130 130 70" fill="none" stroke="#121212" stroke-dasharray="3 2"/>
    <line x1="290" y1="155" x2="340" y2="155" stroke="#121212"/>
    <text x="290" y="148" font-size="10" fill="#121212" class="mono">1 km</text>
    <g transform="translate(0,180)" font-size="10.5">
      <rect width="12" height="12" fill="none" stroke="#121212"/><text x="22" y="10">Baseline 2019</text>
      <rect x="120" width="12" height="12" fill="#C64A2E" opacity=".55"/><text x="142" y="10">Latest 2026</text>
    </g>
  </g>
</svg>
