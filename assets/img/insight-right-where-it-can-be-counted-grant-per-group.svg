<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="'Hanken Grotesk',system-ui,-apple-system,sans-serif">
  <rect width="760" height="320" fill="#FBF8EF"/>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#101010">Average FOLU Net Sink Community Fund grant per group, Indonesia</text>
  <text x="40" y="68" font-size="12" fill="#5A5A5A">IDR millions, averaged by dividing published phase totals by published recipient counts. Our arithmetic, not the ministry's.</text>
  <!-- Scale: x from 220 to 720 maps 0..70 million -->
  <g stroke="#D0CFCA" stroke-width="1">
    <line x1="220" y1="100" x2="220" y2="280"/>
    <line x1="220" y1="280" x2="720" y2="280"/>
    <line x1="363" y1="100" x2="363" y2="280" stroke-dasharray="2 3"/>
    <line x1="506" y1="100" x2="506" y2="280" stroke-dasharray="2 3"/>
    <line x1="649" y1="100" x2="649" y2="280" stroke-dasharray="2 3"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#5A5A5A">
    <text x="220" y="298" text-anchor="middle">0</text>
    <text x="363" y="298" text-anchor="middle">20</text>
    <text x="506" y="298" text-anchor="middle">40</text>
    <text x="649" y="298" text-anchor="middle">60</text>
    <text x="720" y="298" text-anchor="middle">IDR m</text>
  </g>
  <!-- Bars -->
  <g>
    <text x="214" y="140" text-anchor="end" font-size="13" fill="#101010">Phases 1–3</text>
    <text x="214" y="156" text-anchor="end" font-size="10.5" fill="#5A5A5A">(561 groups)</text>
    <rect x="220" y="124" width="243" height="26" fill="#3159C4"/>
    <text x="471" y="142" font-size="12" font-weight="700" fill="#3159C4">IDR 34 m</text>
  </g>
  <g>
    <text x="214" y="186" text-anchor="end" font-size="13" fill="#101010">Phase 4</text>
    <text x="214" y="202" text-anchor="end" font-size="10.5" fill="#5A5A5A">(≈ 200 groups)</text>
    <rect x="220" y="170" width="250" height="26" fill="#3159C4"/>
    <text x="478" y="188" font-size="12" font-weight="700" fill="#3159C4">IDR 35 m</text>
  </g>
  <g>
    <text x="214" y="232" text-anchor="end" font-size="13" fill="#101010">Phase 5</text>
    <text x="214" y="248" text-anchor="end" font-size="10.5" fill="#5A5A5A">(≈ 300 groups)</text>
    <rect x="220" y="216" width="479" height="26" fill="#E0624A"/>
    <text x="707" y="234" font-size="12" font-weight="700" fill="#E0624A">IDR 67 m</text>
  </g>
  <text x="40" y="280" font-size="11" font-style="italic" fill="#5A5A5A"></text>
</svg>
