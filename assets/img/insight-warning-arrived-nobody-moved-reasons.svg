<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Hanken Grotesk',system-ui,-apple-system,sans-serif">
  <rect width="760" height="380" fill="#FBF8EF"/>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#101010">Why people did not act after an English heat-health alert, 2025</text>
  <text x="40" y="68" font-size="12" fill="#5A5A5A">Share of those who saw an alert, per cent. Coral is a relevance failure; blue bars are information failures.</text>
  <!-- Scale: x from 60 to 720 maps 0..20% -->
  <g stroke="#D0CFCA" stroke-width="1">
    <line x1="60" y1="100" x2="60" y2="330"/>
    <line x1="60" y1="330" x2="720" y2="330"/>
    <line x1="192" y1="100" x2="192" y2="330" stroke-dasharray="2 3"/>
    <line x1="324" y1="100" x2="324" y2="330" stroke-dasharray="2 3"/>
    <line x1="456" y1="100" x2="456" y2="330" stroke-dasharray="2 3"/>
    <line x1="588" y1="100" x2="588" y2="330" stroke-dasharray="2 3"/>
    <line x1="720" y1="100" x2="720" y2="330" stroke-dasharray="2 3"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#5A5A5A">
    <text x="60"  y="348" text-anchor="middle">0%</text>
    <text x="192" y="348" text-anchor="middle">5%</text>
    <text x="324" y="348" text-anchor="middle">10%</text>
    <text x="456" y="348" text-anchor="middle">15%</text>
    <text x="588" y="348" text-anchor="middle">20%</text>
  </g>
  <!-- Bars: y pos, label, value in %, color -->
  <!-- 19% coral (relevance failure) -->
  <g>
    <text x="54" y="134" text-anchor="end" font-size="13" fill="#101010">Not personally at risk</text>
    <rect x="60" y="118" width="500" height="24" fill="#E0624A"/>
    <text x="568" y="135" font-size="12" font-weight="700" fill="#E0624A">19%</text>
  </g>
  <!-- 9% blue -->
  <g>
    <text x="54" y="178" text-anchor="end" font-size="13" fill="#101010">Did not recognise the alert</text>
    <rect x="60" y="162" width="238" height="24" fill="#3159C4"/>
    <text x="306" y="179" font-size="12" font-weight="700" fill="#3159C4">9%</text>
  </g>
  <!-- 7% blue -->
  <g>
    <text x="54" y="222" text-anchor="end" font-size="13" fill="#101010">Unsure what to do</text>
    <rect x="60" y="206" width="185" height="24" fill="#3159C4"/>
    <text x="253" y="223" font-size="12" font-weight="700" fill="#3159C4">7%</text>
  </g>
  <!-- 5% blue -->
  <g>
    <text x="54" y="266" text-anchor="end" font-size="13" fill="#101010">Hard to understand</text>
    <rect x="60" y="250" width="132" height="24" fill="#3159C4"/>
    <text x="200" y="267" font-size="12" font-weight="700" fill="#3159C4">5%</text>
  </g>
  <text x="60" y="318" font-size="11" font-style="italic" fill="#5A5A5A">Source: UNU-INWEH policy brief (Khosravi, Assan &amp; Madani 2026), reported by Euronews.</text>
</svg>
